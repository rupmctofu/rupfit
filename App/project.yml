# XcodeGen spec. The generated Rupfit.xcodeproj is not committed (ADR-004).
# Generate from the repository root: xcodegen generate --spec App/project.yml
name: Rupfit
options:
  bundleIdPrefix: com.rupmctofu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RupfitCore:
    path: ..

targets:
  Rupfit:
    type: application
    platform: iOS
    sources:
      - path: Rupfit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rupmctofu.rupfit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: RupfitPersistence
      - package: RupfitCore
        product: RupfitCore

  RupfitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RupfitTests
    dependencies:
      - target: Rupfit
      - package: RupfitCore
        product: RupfitCore

  RupfitPersistence:
    type: framework
    platform: iOS
    sources:
      - path: RupfitPersistence
    dependencies:
      - package: RupfitCore
        product: RupfitCore

  RupfitPersistenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RupfitPersistenceTests
    dependencies:
      - target: RupfitPersistence
      - package: RupfitCore
        product: RupfitCore

  RupfitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RupfitUITests
    dependencies:
      - target: Rupfit

schemes:
  Rupfit:
    build:
      targets:
        Rupfit: all
        RupfitTests: [test]
        RupfitPersistenceTests: [test]
        RupfitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RupfitTests
        - RupfitPersistenceTests
        - RupfitUITests
