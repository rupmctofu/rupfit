<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rupfit</title>
    <meta name="description" content="Entrenamiento de fuerza con decisiones, no con hojas de cálculo." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- The manifest link is injected by vite-plugin-pwa with the configured base; a second
         hand-written one would be duplicated in dist and mis-prefixed in dev. Paths below
         stay base-free so Vite applies `/rupfit/` in dev and in the build alike. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rupfit" />
    <!-- The launch screen (odd/tasks/account-first.md T5). It lives in the HTML, not in
         React, because the moment it covers is the one before React exists: the mark paints
         with the first byte of markup and `main.tsx` removes it once the app has rendered
         its own first frame. No request, no spinner, nothing that pretends to progress. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12111b;
        z-index: 20;
      }
      #boot svg {
        width: 96px;
        height: auto;
        animation: boot-in 260ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <!-- The R, drawn from the same vector as public/logo-mark.svg, inlined so the launch
           screen costs no extra request on a cold start. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="62 54.2 258.6 237.2" role="img" aria-label="Rupfit">

      </svg>
    </div>
    <div id="root"></div>
    <noscript>Rupfit necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
